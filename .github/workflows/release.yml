name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.8"
          cache: pip
      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          # The installer script uses the Inno Setup 6.7 appearance directives
          # (WizardBackImageFile and friends), and the runner image ships an Inno
          # Setup that may be older, so upgrade rather than only installing when
          # the compiler is absent.
          choco upgrade innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup 6 compiler not found at $iscc after install."
          }
      - name: Build and verify release assets
        shell: pwsh
        run: |
          .\scripts\validate-release.ps1 -ExpectedVersion $env:RELEASE_VERSION -Tag $env:RELEASE_TAG
          .\scripts\build-release.ps1 -ExpectedVersion $env:RELEASE_VERSION -BuildInstaller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_VERSION }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # Needed by the Publish step below to read .github/release-notes/<tag>.md. Pinned
      # to the same ref as the build job, so a workflow_dispatch rebuild reads the notes
      # that belong to the tag being rebuilt rather than whatever main says today.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prepended to the generated notes when it exists. The file is named after the
          # version on purpose: one shared preamble would keep repeating the previous
          # release's warning until somebody remembered to clear it, while a missing file
          # simply means no preamble. See docs/RELEASING.md.
          NOTES_ARGS=()
          NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARGS=(--notes "$(cat "$NOTES_FILE")")
            echo "Prepending release notes from $NOTES_FILE"
          else
            echo "No $NOTES_FILE; publishing generated notes only."
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            ${NOTES_ARGS[@]+"${NOTES_ARGS[@]}"}
