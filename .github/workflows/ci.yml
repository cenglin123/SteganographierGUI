name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.8"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source and release inputs
        shell: pwsh
        run: |
          python -m py_compile Steganographier.py
          python Steganographier.py --help
          .\scripts\validate-release.ps1
          .\scripts\test-context-menu-path.ps1
          .\scripts\test-context-menu-registry-write.ps1
          # The context-menu installer is launched by its .cmd shim as
          # powershell.exe (Windows PowerShell 5.1), which marshals native
          # arguments differently from PowerShell 7. v1.3.10's registry writer
          # failed only on 5.1, so assert the installer chain on that host too.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-context-menu-path.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-context-menu-registry-write.ps1
          python .\scripts\test-cli-temp-archive.py
